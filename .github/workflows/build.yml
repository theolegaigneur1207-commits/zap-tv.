name: Construire l'APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk zap-tv.apk

      - name: Garder l'APK dans les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: zap-tv
          path: zap-tv.apk

      - name: Publier une version téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Zap TV 1.0.${{ github.run_number }}
          files: zap-tv.apk
          make_latest: true
        
